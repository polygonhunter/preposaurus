pre-commit:
  piped: true # nacheinander, weil Prettier und ESLint Dateien umschreiben
  jobs:
    - name: prettier
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint --fix --max-warnings=0 --no-warn-ignored {staged_files}
      stage_fixed: true
    - name: typecheck
      run: npm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: knip
      run: npx knip
    - name: vitest
      run: npx vitest run
