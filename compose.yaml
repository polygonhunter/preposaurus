# Preposaurus auf dem NAS (UMSETZUNG M13-02). Schritt für Schritt: docs/INSTALLATION.md
#   Start ohne Tailscale-Container:  docker compose up -d
#   Start mit Tailscale-Container:   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
# Die Werte stehen in der Datei .env im selben Ordner (Vorlage: docker/compose.env.example).
# Die Ordner db, fotos und backups liegen sichtbar neben dieser Datei, damit Snapshots und
# Sicherungen des NAS sie mit erfassen.
# Den App-Port 3000 nie ins LAN freigeben: Er hängt nur an 127.0.0.1 (EINSTELLUNGEN_NUTZER §4.5).

name: preposaurus

x-app: &app
  image: ghcr.io/polygonhunter/preposaurus:${PREPOSAURUS_VERSION:?PREPOSAURUS_VERSION fehlt in .env}
  # Nutzer-ID, der der Ordner fotos gehört (Standard 1000 = Nutzer node im Image)
  user: '${PREPOSAURUS_UID:-1000}:${PREPOSAURUS_GID:-1000}'
  environment: &app-env
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://preposaurus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/preposaurus
    APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env}
    # Tailscale Serve setzt diesen Header und ersetzt dabei einen Wert vom Gerät.
    CLIENT_IP_HEADER: x-forwarded-for
    # anthropic: echte Foto-Erkennung, Schlüssel in der App oder als ANTHROPIC_API_KEY (#108)
    AI_PROVIDER: ${AI_PROVIDER:-anthropic}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    PHOTO_STORAGE_DIR: /data/fotos
    # Mail ist optional: ohne SMTP_HOST keine Mails (#87). APP_URL nur für den Link in Mails.
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_SECURE: ${SMTP_SECURE:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    APP_URL: ${APP_URL:-}
  volumes:
    - ./fotos:/data/fotos
  # Die App braucht keine Linux-Capabilities und darf sich keine Rechte verschaffen.
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  db:
    image: postgres:19.0-trixie
    # Capabilities bleiben: Der Start wechselt per gosu von root zum Nutzer postgres.
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: preposaurus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: preposaurus
    # Ab PostgreSQL 18 liegt das Volume eine Ebene höher als bei 17 (Daten in 19/docker). Eine neue
    # Hauptversion legt ihren Ordner daneben an, der alte bleibt für den Weg zurück (INSTALLATION §12.1).
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U preposaurus -d preposaurus']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Spielt Migrationen und Stammdaten ein und beendet sich dann.
  migrate:
    <<: *app
    command: migrate
    volumes: []
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: web
    environment:
      <<: *app-env
      # Status des Backup-Dienstes für „Daten & System“ (#147), nur lesend. Darin stehen nur
      # Zeitpunkt und Art der letzten Sicherung, nie die Sicherungen selbst.
      BACKUP_STATUS_DIR: /data/backup-status
    volumes:
      - ./fotos:/data/fotos
      - ./backups/status:/data/backup-status:ro
    ports:
      - '127.0.0.1:3000:3000'
    # Der Next-Cache liegt im Arbeitsspeicher und gehört nur dem Nutzer der App. So braucht das
    # Image keinen Ordner, in den jede Nutzer-ID schreiben darf. 64 MB reichen ohne next/image;
    # kommt next/image für Fotos dazu, die Größe neu bemessen (#153). Voll heißt nur: Next loggt.
    tmpfs:
      - /app/.next/cache:uid=${PREPOSAURUS_UID:-1000},gid=${PREPOSAURUS_GID:-1000},mode=0700,size=64m
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Erinnerungen, Mails und Aufräumen (Warteschlange pg-boss in derselben Datenbank, Schema pgboss).
  # Zeitpläne in Europe/Berlin. Beim Stoppen wartet er bis zu 20 Sekunden auf laufende Jobs.
  worker:
    <<: *app
    command: worker
    stop_grace_period: 30s
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Tägliche Sicherung von Datenbank und Fotos nach ./backups (7 tägliche, 4 wöchentliche Stände).
  # Wird "unhealthy", wenn eine Sicherung scheitert oder die letzte über 26 Stunden alt ist.
  #   sofort sichern:    docker compose run --rm backup jetzt  (vor einem Update: jetzt vor-update)
  #   Stände zeigen:     docker compose run --rm backup liste
  #   Probe einspielen:  docker compose run --rm backup pruefen <stand>
  #   zurückspielen:     docker compose stop web worker && docker compose run --rm backup wiederherstellen <stand>
  #                      danach docker compose up -d
  backup:
    image: ghcr.io/polygonhunter/preposaurus-backup:${PREPOSAURUS_VERSION:?PREPOSAURUS_VERSION fehlt in .env}
    # Läuft als root, weil es Fotos jedes Besitzers sichern und zurückspielen muss.
    security_opt: ['no-new-privileges:true']
    environment:
      PGHOST: db
      PGUSER: preposaurus
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      PGDATABASE: preposaurus
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TZ: ${TZ:-Europe/Berlin}
      # Die Stände gehören danach demselben Nutzer wie der Ordner fotos.
      BACKUP_OWNER: '${PREPOSAURUS_UID:-1000}:${PREPOSAURUS_GID:-1000}'
    volumes:
      - ./backups:/backups
      - ./fotos:/fotos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
