# Updates für Abhängigkeiten, Basis-Images und Actions (Review #143). Jede Änderung kommt als PR
# und läuft durch CI und Docker, gemergt wird wie immer von Hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      entwicklung:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Laufzeit ist Node 26 (docker/Dockerfile, CI), die Typen bleiben auf derselben Hauptversion.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Hauptversionen von TypeScript und ESLint brauchen passende Plugins (z. B. jsx-a11y)
      # und kommen gezielt als eigenes Issue, nicht als Dependabot-PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Basis-Images der beiden Dockerfiles
  - package-ecosystem: docker
    directories: [/docker, /docker/backup]
    schedule:
      interval: weekly
    ignore:
      # Node-Hauptversion (derzeit 26) zusammen mit @types/node und der CI anheben, nicht nur im
      # Image (wie in #187), deshalb kommt sie gezielt als eigenes Issue.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # PostgreSQL-Hauptversion braucht einen Datenumzug, kommt gezielt (#250).
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Feste Image-Versionen in compose.yaml und compose.tailscale.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
