name: Release

# Ein Tag vX.Y.Z (oder ein Vorab-Tag wie v0.1.0-rc.1) baut beide Images für amd64 und arm64 und
# schiebt sie mit der Versionsnummer nach ghcr.io (UMSETZUNG M13-04). Ein "latest" gibt es nicht.
# Jede Architektur baut nativ auf einem eigenen Runner, danach fasst ein Job beide zu einem
# Multi-Arch-Image zusammen. Dazu kommt ein GitHub-Release mit den Dateien für die Installation.
# Gebaut wird nur ein Tag auf einem Commit von main, für den CI und Docker grün sind: also erst
# mergen, die Läufe auf main abwarten, dann taggen. Actions sind wegen packages: write per
# Commit-SHA gepinnt, Dependabot hält sie aktuell.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/polygonhunter

jobs:
  verify:
    name: Tag liegt auf main, CI grün
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit liegt auf main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Der Tag zeigt auf $GITHUB_SHA, der nicht auf main liegt."
            exit 1
          }
      - name: CI und Docker sind für diesen Commit grün
        run: |
          for workflow in ci.yml docker.yml; do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$GITHUB_SHA" --event push --status completed --limit 1 \
              --json conclusion --jq '.[0].conclusion // "fehlt"')
            if [ "$conclusion" != success ]; then
              echo "::error::$workflow ist für $GITHUB_SHA nicht grün ($conclusion)."
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: preposaurus
            context: .
            file: docker/Dockerfile
          - name: preposaurus-backup
            context: docker/backup
            file: docker/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image.name }}
      - id: build
        name: Bauen und nach Digest schieben
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Digest merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} zusammenfassen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [preposaurus, preposaurus-backup]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # Nur die Versionsnummer aus dem Tag (v1.2.3 → 1.2.3), bewusst kein latest
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Multi-Arch-Image anlegen
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          META_JSON: ${{ steps.meta.outputs.json }}
      - name: Ergebnis prüfen
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}

  github-release:
    name: GitHub-Release mit Installationsdateien
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Archiv für die Installation packen
        run: docker/release/pack-install-files.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP"
      - name: Release anlegen
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            --title "Preposaurus ${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/preposaurus-${GITHUB_REF_NAME#v}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
