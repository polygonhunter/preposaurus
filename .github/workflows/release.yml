name: Release

# Ein Tag vX.Y.Z (oder ein Vorab-Tag wie v0.1.0-rc.1) baut beide Images für amd64 und arm64 und
# schiebt sie mit der Versionsnummer nach ghcr.io (UMSETZUNG M13-04). Ein "latest" gibt es nicht.
# Jede Architektur baut nativ auf einem eigenen Runner, danach fasst ein Job beide zu einem
# Multi-Arch-Image zusammen. Dazu kommt ein GitHub-Release mit den Dateien für die Installation.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/polygonhunter

jobs:
  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        image:
          - name: preposaurus
            context: .
            file: docker/Dockerfile
          - name: preposaurus-backup
            context: docker/backup
            file: docker/backup/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image.name }}
      - id: build
        name: Bauen und nach Digest schieben
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Digest merken
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} zusammenfassen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [preposaurus, preposaurus-backup]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # Nur die Versionsnummer aus dem Tag (v1.2.3 → 1.2.3), bewusst kein latest
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Multi-Arch-Image anlegen
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          META_JSON: ${{ steps.meta.outputs.json }}
      - name: Ergebnis prüfen
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}

  github-release:
    name: GitHub-Release mit Installationsdateien
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Archiv für die Installation packen
        run: docker/release/pack-install-files.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP"
      - name: Release anlegen
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease \
            --title "Preposaurus ${GITHUB_REF_NAME#v}" \
            "$RUNNER_TEMP/preposaurus-${GITHUB_REF_NAME#v}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
