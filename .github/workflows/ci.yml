name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0' # Git-Hooks braucht die CI nicht
  NEXT_TELEMETRY_DISABLED: '1'
  # Pflicht für env.ts (Serverstart in build und e2e), die DB selbst nutzt erst M1
  DATABASE_URL: pglite://./.data/ci
  AI_PROVIDER: fake
  # Nur für die CI, kein Geheimnis. env.ts verlangt mindestens 32 Zeichen.
  APP_SECRET: ci-nur-zum-testen-kein-geheimnis-0000

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run format:check
      - run: npm run lint
      - name: lint:budget (Richtwert 200 Zeilen, nur Warnung)
        run: npm run lint:budget

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # npm run knip prüft zweimal: mit Tests als Einstieg und mit --production nur den ausgelieferten Code
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test
      # Laufzeit-Grenzen der Lesepfade (#141) allein, ohne parallele Testdateien daneben
      - run: npm run test:perf

  # Dieselbe Suite gegen PostgreSQL 18: tests/helpers/test-db.ts legt je Testdatei eine eigene
  # Datenbank auf diesem Dienst an, spielt alle Migrationen ein und löscht sie danach wieder.
  test-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          # Wegwerf-Datenbank nur für diesen Lauf, kein Geheimnis
          POSTGRES_USER: preposaurus
          POSTGRES_PASSWORD: preposaurus
          POSTGRES_DB: preposaurus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U preposaurus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://preposaurus:preposaurus@localhost:5432/preposaurus
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vitest gegen PostgreSQL 18
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build

  # Version von @playwright/test aus package-lock.json für das Container-Image von e2e (#271).
  # So zieht ein Dependabot-Update von Playwright das Image ohne eigenen Schritt mit.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: lock
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version // empty' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Keine feste Version von @playwright/test in package-lock.json ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Im offiziellen Playwright-Image liegen Browser und Systempakete schon bereit. Das frühere
  # `playwright install --with-deps` hing an apt und brauchte mit langsamem Spiegel bis 15 min.
  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run licenses
