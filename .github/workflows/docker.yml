name: Docker

# Baut die Images für amd64 und arm64 ohne Push und startet compose.yaml wie auf dem NAS
# (UMSETZUNG M13-01, M13-02). Jede Architektur läuft auf einem eigenen, nativen Runner.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image und Compose (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: App-Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ghcr.io/polygonhunter/preposaurus:ci
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: sharp lädt im Image
        run: >-
          docker run --rm --entrypoint node ghcr.io/polygonhunter/preposaurus:ci
          -e "require('sharp'); console.log('sharp ok auf', process.arch)"
      - name: Compose bis /api/health
        run: docker/test/compose-test.sh
